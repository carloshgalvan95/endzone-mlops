name: 'endzone_mlops'
version: '0.1.0'
config-version: 2

# Project profile (maps to profiles.yml)
profile: 'endzone_mlops'

# Directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Model configuration
models:
  endzone_mlops:
    # Staging models: views for development speed
    staging:
      +materialized: view
      +schema: staging

    # Marts: tables for downstream consumption
    marts:
      +materialized: table
      +schema: marts

# Tests
# store_failures stays off. Each stored failure is a table or a view in
# <target_schema>_test_results, and Unity Catalog counts both toward the
# 100-relation quota on that schema. dbt already reports a failing test.
# Pass --store-failures on one invocation to inspect rows. Those rows land
# in the schema below. tests/test_dbt_store_failures.py rejects a project
# or directory setting that turns store_failures on for every test.
tests:
  endzone_mlops:
    +schema: test_results

# Seeds (uncomment when seeds/ has data files)
# seeds:
#   endzone_mlops:
#     +schema: seeds

# Documentation
vars:
  # Project metadata
  project_name: "endzone-mlops"
  project_version: "0.1.0"
  
  # Data source metadata (for documentation)
  data_source: "nflverse"
  data_license: "CC BY 4.0"
  data_coverage: "1999-present"
