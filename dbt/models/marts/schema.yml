version: 2

models:
  - name: fct_team_game_epa
    description: |
      Team-game level fact table with EPA and play metrics.
      
      Grain: One row per team per game (two rows per completed game).
      Each team's offensive and defensive performance is captured separately.
      
      Useful for building features that capture recent team performance,
      offensive/defensive strength, and play-calling tendencies.
    
    config:
      meta:
        owner: "Carlos Galvan"
        layer: "marts"
        grain: "game_id, team"
    
    columns:
      - name: game_id
        description: "Game identifier (foreign key to fct_games)"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nflverse__games')
                field: game_id
              config:
                severity: warn
      
      - name: team
        description: "Team abbreviation (historical name from games.parquet)"
        tests:
          - not_null
      
      - name: team_franchise
        description: "Current franchise abbreviation (handles relocations: OAK->LV, SD->LAC, STL->LA)"
        tests:
          - not_null
      
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      
      - name: week
        description: "Week number"
      
      - name: game_type
        description: "Game type (REG, POST, etc.)"
      
      - name: opponent
        description: "Opponent team abbreviation (historical name from games.parquet)"
        tests:
          - not_null
      
      - name: opponent_franchise
        description: "Opponent's current franchise abbreviation (handles relocations)"
        tests:
          - not_null
      
      - name: is_home
        description: "Home/away indicator (1 = home, 0 = away)"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      
      - name: team_score
        description: "Team's final score"
      
      - name: opponent_score
        description: "Opponent's final score"
      
      - name: offensive_plays
        description: "Number of offensive plays (valid plays only, play = 1)"
      
      - name: offensive_epa
        description: "Total offensive Expected Points Added"
      
      - name: avg_offensive_epa
        description: "Average offensive EPA per play"
      
      - name: pass_epa
        description: "Total EPA on pass plays"
      
      - name: rush_epa
        description: "Total EPA on rush plays"
      
      - name: defensive_epa_allowed
        description: "Total defensive EPA allowed (opponent's offensive EPA)"
      
      - name: avg_defensive_epa_allowed
        description: "Average defensive EPA allowed per play"
      
      - name: success_rate
        description: "Percentage of successful plays (success = 1)"

      - name: clean_offensive_plays
        description: "Offensive plays with play = 1, play_type pass or run, qb_kneel and qb_spike not 1, and pre-snap wp inside [0.05, 0.95]. A null wp is kept. no_play is excluded."
        tests:
          - not_null

      - name: avg_clean_offensive_epa
        description: "Offensive EPA per clean play. Null when clean_offensive_plays is 0. Does not replace avg_offensive_epa."

      - name: clean_success_rate
        description: "Share of clean offensive plays with success = 1. Null when there are no clean offensive plays."

      - name: clean_defensive_plays
        description: "Defensive plays facing a clean offensive play (same pass/run, kneel, spike, and wp filter)."
        tests:
          - not_null

      - name: avg_clean_defensive_epa_allowed
        description: "EPA allowed per clean defensive play. Null when clean_defensive_plays is 0. Does not replace avg_defensive_epa_allowed."

      - name: clean_defensive_success_rate
        description: "Share of clean plays allowed with success = 1. Null when there are no clean defensive plays."

    tests:
      # Grain test: game_id + team should be unique
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - team
      
      # Business logic: team and opponent should differ
      - dbt_utils.expression_is_true:
          arguments:
            expression: "team != opponent"
          config:
            where: "team is not null and opponent is not null"
      
      # Business logic: completed games should have offensive_plays > 0
      # except for known pbp gaps documented in known_pbp_gaps seed
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              offensive_plays > 0 OR 
              (game_id || '|' || team) IN (
                SELECT game_id || '|' || team 
                FROM {{ ref('known_pbp_gaps') }}
              )

      # Clean offensive plays are a subset of play = 1 offensive plays.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "clean_offensive_plays <= offensive_plays"

      - dbt_utils.expression_is_true:
          arguments:
            expression: "clean_success_rate >= 0 and clean_success_rate <= 1"
          config:
            where: "clean_success_rate is not null"

      - dbt_utils.expression_is_true:
          arguments:
            expression: "clean_defensive_success_rate >= 0 and clean_defensive_success_rate <= 1"
          config:
            where: "clean_defensive_success_rate is not null"

  - name: fct_games
    description: |
      Game-level fact table with results and derived outcomes.
      
      Grain: One row per game.
      Includes final scores, derived outcomes (winner, margin, total points),
      and betting line results (spread covered, over/under).
      
      Useful for model training labels, feature engineering based on recent
      results, and backtesting against betting markets.
    
    config:
      meta:
        owner: "Carlos Galvan"
        layer: "marts"
        grain: "game_id"
    
    columns:
      - name: game_id
        description: "Primary key - unique game identifier"
        tests:
          - unique
          - not_null
      
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      
      - name: week
        description: "Week number"
      
      - name: game_type
        description: "Game type (REG, POST, etc.)"
      
      - name: away_team
        description: "Away team abbreviation"
        tests:
          - not_null
      
      - name: home_team
        description: "Home team abbreviation"
        tests:
          - not_null
      
      - name: away_score
        description: "Final away team score (null if not yet played)"
      
      - name: home_score
        description: "Final home team score (null if not yet played)"
      
      - name: home_won
        description: "Home team won (1 = yes, 0 = no, null = not yet played)"
      
      - name: home_margin
        description: "Home team margin of victory (positive = home won)"
      
      - name: total_points
        description: "Combined final score (away + home)"
      
      - name: home_covered_spread
        description: "Home team covered spread (1 = yes, 0 = no, null = push or missing)"
      
      - name: total_over
        description: "Total went over (1 = yes, 0 = no, null = push or missing)"
      
      - name: spread_line
        description: "Closing point spread (home team perspective)"
      
      - name: total_line
        description: "Closing over/under total"
      
      - name: gameday
        description: "Date of game"
      
      - name: roof
        description: "Stadium roof type"
      
      - name: surface
        description: "Playing surface"

    tests:
      # Business logic: home and away teams should differ
      - dbt_utils.expression_is_true:
          arguments:
            expression: "away_team != home_team"
          config:
            where: "away_team is not null and home_team is not null"
      
      # Business logic: home_won should be consistent with margin
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(home_won = 1 and home_margin > 0) or (home_won = 0 and home_margin <= 0)"
          config:
            where: "home_won is not null and home_margin is not null"
      
      # Business logic: total_points should equal sum of scores
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_points = (home_score + away_score)"
          config:
            where: "total_points is not null and home_score is not null and away_score is not null"

  - name: fct_upcoming_games
    description: |
      Upcoming games (scheduled but not yet completed).
      
      Grain: One row per game (UPCOMING GAMES ONLY).
      Games where home_score and away_score are both null.
      
      Provides game-level features for pregame predictions (scoring input).
      Used for weekly forecast refresh and batch scoring.
    
    config:
      meta:
        owner: "Carlos Galvan"
        layer: "marts"
        grain: "game_id"
    
    columns:
      - name: game_id
        description: "Primary key - unique game identifier"
        tests:
          - unique
          - not_null
      
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      
      - name: week
        description: "Week number"
      
      - name: game_type
        description: "Game type (REG, POST, etc.)"
      
      - name: away_team
        description: "Away team abbreviation (historical name from games.parquet)"
        tests:
          - not_null
      
      - name: away_team_franchise
        description: "Away team's current franchise abbreviation (handles relocations)"
        tests:
          - not_null
      
      - name: home_team
        description: "Home team abbreviation (historical name from games.parquet)"
        tests:
          - not_null
      
      - name: home_team_franchise
        description: "Home team's current franchise abbreviation (handles relocations)"
        tests:
          - not_null
      
      - name: gameday
        description: "Date of game"
      
      - name: gametime
        description: "Game time (EST)"
      
      - name: spread_line
        description: "Closing point spread (home team perspective)"
      
      - name: total_line
        description: "Closing over/under total"
      
      - name: roof
        description: "Stadium roof type"
      
      - name: surface
        description: "Playing surface"
      
      - name: away_rest
        description: "Days of rest for away team"
      
      - name: home_rest
        description: "Days of rest for home team"

    tests:
      # Business logic: home and away teams should differ
      - dbt_utils.expression_is_true:
          arguments:
            expression: "away_team != home_team"
          config:
            where: "away_team is not null and home_team is not null"

  - name: fct_expected_starter
    description: |
      Expected starting quarterback from the weekly depth chart.

      Grain: one row per completed game.
      The starter is offense QB depth_team 1 for that season, week, and game_type.
      This model does not read play-by-play. A null starter id means the chart
      had no QB1, and the feature code falls back to the previous primary passer.

    config:
      meta:
        owner: "Carlos Galvan"
        layer: "marts"
        grain: "game_id"

    columns:
      - name: game_id
        description: "Completed game identifier"
        tests:
          - unique
          - not_null
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      - name: gameday
        description: "Date of the game"
        tests:
          - not_null
      - name: home_team
        description: "Home team abbreviation on the schedule"
        tests:
          - not_null
      - name: away_team
        description: "Away team abbreviation on the schedule"
        tests:
          - not_null
      - name: home_starter_player_id
        description: "Depth-chart QB1 gsis id for the home team. Null when the chart has no QB1."
      - name: away_starter_player_id
        description: "Depth-chart QB1 gsis id for the away team. Null when the chart has no QB1."

  - name: fct_qb_dropbacks
    description: |
      Dropbacks by passer and completed game.

      Grain: one row per game_id and passer_player_id.
      This is who played. It is not the expected starter.

    config:
      meta:
        owner: "Carlos Galvan"
        layer: "marts"
        grain: "game_id, passer_player_id"

    columns:
      - name: game_id
        description: "Completed game identifier"
        tests:
          - not_null
      - name: passer_player_id
        description: "GSIS id of the passer who dropped back"
        tests:
          - not_null
      - name: team_franchise
        description: "Current franchise of the possession team"
        tests:
          - not_null
      - name: dropbacks
        description: "Dropback count for this passer in this game"
        tests:
          - not_null
      - name: dropback_epa
        description: "Sum of EPA on those dropbacks. A null EPA counts as 0."
        tests:
          - not_null
      - name: gameday
        description: "Date of the game"
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - passer_player_id
