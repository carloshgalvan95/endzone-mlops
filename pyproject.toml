[project]
name = "endzone-mlops"
version = "0.1.0"
description = "NFL lakehouse + MLOps portfolio demonstrating Databricks + dbt + MLflow patterns"
authors = [
    {name = "Carlos Galvan", email = "carloshgalvan95@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

# Direct dependencies for ingest, dbt, training, and the warehouse client.
# Dev tools live in the dev group below. uv.lock pins the full graph.
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.8.0",
    "databricks-sdk>=0.18.0",
    "databricks-sql-connector>=3.0.0",
    "dbt-core>=1.8.0,<2.0.0",
    "dbt-duckdb>=1.8.0,<2.0.0",
    "dbt-databricks>=1.8.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N803",  # argument name should be lowercase (ML convention: X, y)
    "N806",  # variable in function should be lowercase (ML convention: X, y)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
