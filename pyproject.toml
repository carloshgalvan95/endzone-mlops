[project]
name = "endzone-mlops"
version = "0.1.0"
description = "NFL lakehouse + MLOps portfolio demonstrating Databricks + dbt + MLflow patterns"
authors = [
    {name = "Carlos Galvan", email = "carloshgalvan95@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}

# Direct dependencies for ingest, dbt, training, and the warehouse client.
# Dev tools live in the dev group below. uv.lock pins the full graph.
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.8.0",
    "databricks-sdk>=0.18.0",
    "databricks-sql-connector>=3.0.0",
    "python-dotenv>=1.0.1",
    "dbt-core>=1.8.0,<2.0.0",
    "dbt-duckdb>=1.8.0,<2.0.0",
    "dbt-databricks>=1.8.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.17.0",
    "vulture>=2.14",
    "import-linter==2.15",
]

[tool.uv]
package = true
default-groups = ["dev"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["endzone*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["endzone", "tests", "scripts"]

[tool.ruff.lint.isort]
known-first-party = ["endzone", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N803",  # argument name should be lowercase (ML convention: X, y)
    "N806",  # variable in function should be lowercase (ML convention: X, y)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["endzone"]

[tool.importlinter]
root_packages = ["endzone"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Endzone layers match the current packages"
type = "layers"
layers = [
    "endzone.analysis",
    "endzone.train | endzone.ingest",
    "endzone.features | endzone.data",
    "endzone.utils",
]

[[tool.importlinter.contracts]]
name = "Features do not import train"
type = "forbidden"
source_modules = ["endzone.features"]
forbidden_modules = ["endzone.train"]

[[tool.importlinter.contracts]]
name = "Features do not import mlflow"
type = "forbidden"
source_modules = ["endzone.features"]
forbidden_modules = ["mlflow"]

[[tool.importlinter.contracts]]
name = "Ingest does not import train"
type = "forbidden"
source_modules = ["endzone.ingest"]
forbidden_modules = ["endzone.train"]

[[tool.importlinter.contracts]]
name = "Analysis does not import train except the phase 0 audit"
type = "forbidden"
source_modules = ["endzone.analysis"]
forbidden_modules = ["endzone.train"]
ignore_imports = [
    "endzone.analysis.feature_audit -> endzone.train.train",
]

[[tool.importlinter.contracts]]
name = "Config does not import the pipeline packages"
type = "forbidden"
source_modules = ["endzone.config"]
forbidden_modules = [
    "endzone.analysis",
    "endzone.train",
    "endzone.ingest",
    "endzone.features",
    "endzone.data",
]
