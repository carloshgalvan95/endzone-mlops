[project]
name = "endzone-mlops"
version = "0.1.0"
description = "NFL lakehouse + MLOps portfolio demonstrating Databricks + dbt + MLflow patterns"
authors = [
    {name = "Carlos Galvan", email = "carloshgalvan95@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

dbt = [
    "dbt-core>=1.6.0",
    "dbt-duckdb>=1.6.0",
]

databricks = [
    "dbt-databricks>=1.6.0",
    "mlflow>=2.8.0",
    "databricks-sdk>=0.18.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
