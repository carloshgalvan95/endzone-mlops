name: CI

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install the locked environment
      run: uv sync --frozen

    - name: Lint with ruff
      run: uv run ruff check src/ tests/

    - name: Format check with ruff
      run: uv run ruff format --check src/ tests/

    - name: Unused code with vulture
      run: uv run vulture src scripts --min-confidence 80

    - name: Run tests with pytest
      run: uv run pytest tests/ -v --tb=short

    - name: Coverage of the feature audit
      run: uv run pytest tests/test_feature_leakage.py tests/test_feature_audit.py tests/test_epa_play_filter_check.py --cov=src/analysis --cov-report=term-missing --cov-fail-under=100

    - name: Install dbt packages
      run: cd dbt && uv run dbt deps --profiles-dir .

    - name: Create dbt profiles.yml for CI
      run: |
        cd dbt
        cat > profiles.yml << 'EOF'
        endzone_mlops:
          target: local
          outputs:
            local:
              type: duckdb
              path: ./target/endzone_mlops.duckdb
              schema: main
              threads: 4
        EOF

    - name: dbt compile (local DuckDB)
      run: |
        cd dbt && uv run dbt deps --profiles-dir . && uv run dbt seed --profiles-dir . --target local && uv run dbt compile --profiles-dir . --target local

  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install the locked environment
      run: uv sync --frozen

    - name: Lint with ruff
      run: uv run ruff check src/ tests/

    - name: Format check with ruff
      run: uv run ruff format --check src/ tests/

    - name: Run tests with pytest
      run: uv run pytest tests/ -v --tb=short

  badge:
    runs-on: ubuntu-latest
    needs: [test, cross-platform]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.cross-platform.result }}" == "success" ]; then
            echo "All tests passed"
          else
            echo "Tests failed"
            exit 1
          fi
