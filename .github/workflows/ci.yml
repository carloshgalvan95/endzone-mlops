name: CI

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Format check with ruff
      run: |
        ruff format --check src/ tests/

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short

    - name: Install dbt packages
      run: |
        cd dbt && dbt deps --profiles-dir .

    - name: Create dbt profiles.yml for CI
      run: |
        cd dbt
        cat > profiles.yml << 'EOF'
        endzone_mlops:
          target: local
          outputs:
            local:
              type: duckdb
              path: ./target/endzone_mlops.duckdb
              schema: main
              threads: 4
        EOF

    - name: dbt compile (local DuckDB)
      run: |
        cd dbt && dbt compile --profiles-dir . --target local

    # Future: dbt build with Databricks (requires secrets)
    # - name: dbt build (Databricks)
    #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    #   env:
    #     DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
    #     DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    #     DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
    #   run: |
    #     cd dbt && dbt build --profiles-dir . --target databricks_ce

  badge:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "All tests passed"
          else
            echo "Tests failed"
            exit 1
          fi
