name: Results

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. nflverse posts final scores after the game, with a
    # short delay. This is not a live play-by-play feed.
    #
    # Thursday Night Football ends late Thursday in the US, which is early
    # Friday UTC. One pass after that window is enough.
    - cron: "30 8 * * 5"
    # Hourly through Sunday UTC, covering the afternoon and evening slate.
    - cron: "15 * * * 0"
    # Hourly from Sunday evening into Monday morning UTC, so Sunday Night
    # Football is picked up after the late kickoff.
    - cron: "15 0-8 * * 1"
    # Monday Night Football ends late Monday in the US, which is early
    # Tuesday UTC. This stays ahead of the Tuesday scoring deploy at 12:00 UTC.
    - cron: "30 8 * * 2"

permissions:
  contents: read
  pages: write
  id-token: write

# Share the Pages concurrency group so a results deploy waits for an
# in-flight scoring deploy instead of canceling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Overlay final scores on the published weeks
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          uv run python -m endzone.site.results --restore-published "${pages_base}"

      - name: Check the refreshed site still has a real week
        run: |
          uv run python - << 'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("site/data/latest.json").read_text(encoding="utf-8"))
          if latest.get("sample") is True:
              raise SystemExit("latest.json is the example slate.")
          games = latest.get("games") or []
          if len(games) == 0:
              raise SystemExit("latest.json has no games.")
          print(
              f"Refreshing season {latest.get('season')} week {latest.get('week')} "
              f"({len(games)} games)."
          )
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
