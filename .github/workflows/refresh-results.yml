name: Results

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. nflverse posts final scores after the game, with a
    # short delay. This is not a live play-by-play feed.
    #
    # Thursday Night Football ends late Thursday in the US, which is early
    # Friday UTC. One pass after that window is enough.
    - cron: "30 8 * * 5"
    # Hourly through Sunday UTC, covering the afternoon and evening slate.
    - cron: "15 * * * 0"
    # Hourly from Sunday evening into Monday morning UTC, so Sunday Night
    # Football is picked up after the late kickoff.
    - cron: "15 0-8 * * 1"
    # Monday Night Football ends late Monday in the US, which is early
    # Tuesday UTC. This stays ahead of the Tuesday scoring deploy at 12:00 UTC.
    - cron: "30 8 * * 2"

# Jobs narrow this. contents: write is only on the archive job.
# issues: write is only on the build job, for the model alert.
# Warehouse credentials are not used here.
permissions:
  contents: read

# Share the Pages concurrency group so a results deploy waits for an
# in-flight scoring deploy instead of canceling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Restore published slates
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          uv run python -m endzone.site.archive restore \
            --output-dir site/data \
            --pages-base "${pages_base}" \
            --repo "${GITHUB_WORKSPACE}" \
            --remote origin \
            --branch published-slates

      - name: Overlay final scores on the published weeks
        run: uv run python -m endzone.site.results --output-dir site/data

      # Derived file only. Week JSON is not modified. A missing archive
      # writes an unavailable record and does not invent week results.
      - name: Write the track record
        run: |
          uv run python -m endzone.site.track_record \
            --repo "${GITHUB_WORKSPACE}" \
            --site-data site/data \
            --output site/data/track_record.json \
            --remote origin \
            --branch published-slates \
            --stamp-html site/index.html

      - name: Alert when the model is behind the market
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m endzone.site.model_alert \
            --repo "${GITHUB_WORKSPACE}" \
            --site-data site/data \
            --remote origin \
            --branch published-slates

      - name: Check the refreshed site still has a real week
        run: |
          uv run python - << 'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("site/data/latest.json").read_text(encoding="utf-8"))
          if latest.get("sample") is True:
              raise SystemExit("latest.json is the example slate.")
          games = latest.get("games") or []
          if len(games) == 0:
              raise SystemExit("latest.json has no games.")
          print(
              f"Refreshing season {latest.get('season')} week {latest.get('week')} "
              f"({len(games)} games)."
          )
          PY

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  archive:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Archive published slates
        run: |
          uv run python -m endzone.site.archive publish \
            --repo "${GITHUB_WORKSPACE}" \
            --site-data site/data \
            --remote origin \
            --branch published-slates

  deploy:
    needs: archive
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
