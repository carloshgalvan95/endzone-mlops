name: Databricks Smoke Test

on:
  workflow_dispatch:  # Manual trigger only (no push/PR triggers to avoid exposing secrets in forks)

jobs:
  databricks-smoke:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv and Python 3.12
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Install the locked environment
      run: uv sync --frozen

    - name: Configure dbt profile
      run: |
        cd dbt
        cp profiles.yml.example profiles.yml
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    - name: Install dbt packages
      run: |
        cd dbt
        uv run dbt deps --profiles-dir .
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    - name: Test Databricks connection
      run: |
        cd dbt
        uv run dbt debug --profiles-dir . --target databricks
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    - name: Compile dbt models against Databricks
      run: |
        cd dbt
        uv run dbt compile --profiles-dir . --target databricks
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
