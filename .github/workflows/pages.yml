name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      season:
        description: Season to score. Leave empty for the next unplayed week.
        required: false
        default: ""
        type: string
      week:
        description: Week to score. Leave empty for the next unplayed week.
        required: false
        default: ""
        type: string
      replace_published:
        description: Rebuild every scheduled game for season and week. Requires both. Trains only on games before that week.
        required: false
        default: false
        type: boolean
      backfill_archive:
        description: Seed published-slates from the live site. Does not score or deploy.
        required: false
        default: false
        type: boolean
  schedule:
    # Tuesday 12:00 UTC, after the Monday night game.
    # This is the automatic score. A push does not fit a model.
    - cron: "0 12 * * 2"

# Jobs narrow this. contents: write is only on the archive job.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.backfill_archive != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      # A push restores published files and overlays finals. It does not
      # refresh the warehouse or fit a model.
      - name: Configure the dbt profile
        if: github.event_name != 'push'
        working-directory: dbt
        run: cp profiles.yml.example profiles.yml

      - name: Refresh the current season
        if: github.event_name != 'push'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MSYS_NO_PATHCONV: "1"
        run: uv run python -m endzone.ingest.load_raw_nflverse --current-season --dataset all

      - name: Build Databricks marts
        if: github.event_name != 'push'
        working-directory: dbt
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          MSYS_NO_PATHCONV: "1"
        run: uv run dbt deps --profiles-dir . && uv run dbt build --profiles-dir . --target databricks

      - name: Restore published slates
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          uv run python -m endzone.site.archive restore \
            --output-dir site/data \
            --pages-base "${pages_base}" \
            --repo "${GITHUB_WORKSPACE}" \
            --remote origin \
            --branch published-slates

      - name: Score an unpublished week
        if: github.event_name != 'push'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # Load alias prod from Unity Catalog. A missing alias still fits
          # this week and registers that fit in the sqlite file below.
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_REGISTRY_URI: databricks-uc
          MSYS_NO_PATHCONV: "1"
          SCORE_SEASON: ${{ github.event.inputs.season || '' }}
          SCORE_WEEK: ${{ github.event.inputs.week || '' }}
          REPLACE_PUBLISHED: ${{ github.event.inputs.replace_published || '' }}
        run: |
          args=()
          if [ -n "${SCORE_SEASON}" ]; then
            args+=(--season "${SCORE_SEASON}")
          fi
          if [ -n "${SCORE_WEEK}" ]; then
            args+=(--week "${SCORE_WEEK}")
          fi
          if [ "${REPLACE_PUBLISHED}" = "true" ]; then
            if [ -z "${SCORE_SEASON}" ] || [ -z "${SCORE_WEEK}" ]; then
              echo "replace_published needs season and week." >&2
              exit 1
            fi
            args+=(--replace-published)
          fi
          uv run python -m endzone.modeling.score "${args[@]}"

      - name: Overlay final scores on published weeks
        run: uv run python -m endzone.site.results --output-dir site/data

      # Derived file only. Week JSON is not modified. A missing archive
      # writes an unavailable record and does not invent week results.
      - name: Write the track record
        run: |
          uv run python -m endzone.site.track_record \
            --repo "${GITHUB_WORKSPACE}" \
            --site-data site/data \
            --output site/data/track_record.json \
            --remote origin \
            --branch published-slates \
            --stamp-html site/index.html

      - name: Check the published week is not the example slate
        run: |
          uv run python - << 'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("site/data/latest.json").read_text(encoding="utf-8"))
          if latest.get("sample") is True:
              raise SystemExit("latest.json is the example slate.")
          games = latest.get("games") or []
          if len(games) == 0:
              raise SystemExit("latest.json has no games.")
          print(
              f"Publishing season {latest.get('season')} week {latest.get('week')} "
              f"({len(games)} games)."
          )
          PY

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  archive:
    needs: build
    if: >-
      always() &&
      (needs.build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.backfill_archive == 'true' &&
          needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Download the built site
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.backfill_archive != 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Archive published slates
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.backfill_archive != 'true'
        run: |
          uv run python -m endzone.site.archive publish \
            --repo "${GITHUB_WORKSPACE}" \
            --site-data site/data \
            --remote origin \
            --branch published-slates

      - name: Backfill published slates
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill_archive == 'true'
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          uv run python -m endzone.site.archive backfill \
            --repo "${GITHUB_WORKSPACE}" \
            --pages-base "${pages_base}" \
            --remote origin \
            --branch published-slates

  deploy:
    needs: [build, archive]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
