name: Slate check

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC and best effort. America/Mexico_City is UTC-6.
    # 14:07 UTC is 08:07 CT. 16:13 UTC is 10:13 CT. Odd minutes, after the
    # Tuesday morning scoring window. This job does not score or deploy.
    - cron: "7 14 * * 2"
    - cron: "13 16 * * 2"

# The check reads the repo and published-slates. It opens an issue.
# It does not write to a branch, deploy Pages, or use a warehouse secret.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Check the published slate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m endzone.site.slate_check \
            --repo "${GITHUB_WORKSPACE}" \
            --remote origin \
            --branch published-slates
